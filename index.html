<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:       #14171e;
  --surface:  #1c1f26;
  --surface2: #22262f;
  --border:   #2e3340;
  --red:      #e83a2f;
  --red2:     #c42e24;
  --silver:   #c8d0dc;
  --bronze:   #f59e0b;
  --green:    #22c55e;
  --danger:   #ef4444;
  --orange:   #f97316;
  --text:     #f1f3f6;
  --muted:    #8a95a3;
  --c0: #e83a2f;
  --c1: #f59e0b;
  --c2: #22c55e;
  --c3: #38bdf8;
  --c4: #a78bfa;
  --c5: #fb923c;
  --c6: #34d399;
}

* { margin:0; padding:0; box-sizing:border-box; }

body::before { content:""; display:block; height:4px; background:linear-gradient(90deg,var(--red2),var(--red),#ff6b5b); position:fixed; top:0;left:0;right:0;z-index:999; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  font-size:16px;
  height:100vh;
  overflow:hidden;
}
body, #dashboard { background:var(--bg); }

/* ── UPLOAD SCREEN ── */
#upload-screen {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; height:100vh; gap:2rem; padding:2rem;
  background:var(--bg);
}
#upload-screen h1 {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,8vw,6rem); letter-spacing:.06em;
  color:var(--red); text-align:center; line-height:1;
}
#upload-screen > p { color:var(--muted); font-size:1.1rem; text-align:center; max-width:500px; }
#drop-zone {
  width:min(520px,90vw); border:2px dashed var(--border);
  border-radius:16px; padding:3.5rem 2rem; text-align:center;
  cursor:pointer; transition:all .3s; background:var(--surface);
}
#drop-zone:hover, #drop-zone.drag-over {
  border-color:var(--red); background:rgba(232,58,47,.06);
  transform:translateY(-2px); box-shadow:0 0 24px rgba(232,58,47,.18);
}
#drop-zone .icon { font-size:3.5rem; margin-bottom:1rem; }
#drop-zone h2 { font-size:1.3rem; font-weight:600; margin-bottom:.5rem; }
#drop-zone p  { color:var(--muted); font-size:.9rem; }
#file-input { display:none; }
.btn {
  background:var(--red); color:#fff; border:none;
  padding:.75rem 2rem; font-family:'Bebas Neue',sans-serif;
  font-size:1.2rem; letter-spacing:.08em; border-radius:8px;
  cursor:pointer; transition:all .2s; margin-top:1.2rem;
}
.btn:hover { background:var(--red2); transform:translateY(-1px); }

/* ── DASHBOARD ── */
#dashboard {
  height:100vh; padding:1.2rem 1.1rem .5rem;
  display:none; flex-direction:column; gap:.6rem;
  background:var(--bg);
}

/* Header */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:.5rem; border-bottom:1px solid var(--border); flex-shrink:0;
}
.header-title { font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.6rem,3vw,2.6rem); letter-spacing:.06em; color:var(--red); line-height:1;
}
.header-meta { font-size:.88rem; color:var(--muted); margin-top:.12rem; display:none; }
.header-right { display:flex; gap:.7rem; align-items:center; }
.live-badge {
  display:flex; align-items:center; gap:.4rem;
  background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4);
  border-radius:100px; padding:.3rem .8rem;
  font-size:.92rem; font-weight:700; color:var(--green);
}
.live-dot { width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.reload-btn {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--silver); padding:.42rem .9rem; border-radius:7px;
  cursor:pointer; font-size:.95rem; transition:all .2s;
}
.reload-btn:hover { border-color:var(--red); color:var(--red); }
#refresh-countdown { font-size:.92rem; color:var(--muted); }

/* Grand banner */
.grand-banner {
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(135deg,#1c1f26 0%,#22262f 100%);
  border:2px solid var(--red); border-radius:11px;
  padding:.65rem 1.2rem;
  box-shadow:0 2px 16px rgba(232,58,47,.18); flex-shrink:0;
}
.grand-label { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:.14em; color:var(--muted); }
.grand-value { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.4rem,5vw,4.2rem); color:var(--red); line-height:1; }
.grand-vs { text-align:right; }
.grand-vs .gl { font-size:.92rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.grand-vs .gv { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; }
.diff-up   { color:var(--green); font-size:1.05rem; font-weight:700; }
.diff-down { color:var(--danger); font-size:1.05rem; font-weight:700; }
.diff-zero { color:var(--muted); font-size:1.05rem; }

/* Stat cards row */
.stat-row { display:grid; grid-template-columns:repeat(5,1fr); gap:.55rem; flex-shrink:0; }
.stat-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:1rem 1rem; position:relative; overflow:hidden;
  box-shadow:0 1px 6px rgba(0,0,0,.3);
}
.stat-card::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; }
.stat-card:nth-child(1)::before { background:var(--c0); }
.stat-card:nth-child(2)::before { background:var(--c1); }
.stat-card:nth-child(3)::before { background:var(--c2); }
.stat-card:nth-child(4)::before { background:var(--c3); }
.stat-card:nth-child(5)::before { background:var(--c4); }
.stat-card:nth-child(6)::before { background:var(--c5); }
.stat-card:nth-child(7)::before { background:var(--c6); }
.sc-lbl { font-size:1.1rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:.3rem; font-weight:600; }
.sc-val { font-family:'Bebas Neue',sans-serif; font-size:clamp(3rem,5vw,5rem); line-height:1; }
.sc-sub { font-size:.95rem; color:var(--muted); margin-top:.3rem; }

/* Leaderboard */
.lb-wrap {
  flex:1; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--border);
  border-radius:11px; overflow:hidden; min-height:0;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}
.lb-scroll { flex:1; overflow:auto; }
.lb-table { width:100%; border-collapse:collapse; table-layout:fixed; }

.lb-table thead th {
  background:#1c1f26; color:#c8d0dc;
  font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
  padding:.42rem .35rem; text-align:center;
  border-bottom:2px solid var(--red);
  white-space:nowrap; position:sticky; top:0; z-index:10;
}
.lb-table thead tr:first-child th { border-bottom:1px solid rgba(255,255,255,.15); }
.th-grp { border-left:2px solid rgba(255,255,255,.2) !important; }

.lb-table tbody tr { border-bottom:1px solid var(--border); transition:background .15s; }
.lb-table tbody tr:hover { background:rgba(232,58,47,.04); }
.lb-table tbody tr.rank-1 { background:rgba(232,58,47,.08); }
.lb-table tbody tr.rank-2 { background:rgba(200,208,220,.04); }
.lb-table tbody tr.rank-3 { background:rgba(245,158,11,.05); }

.lb-table tbody td {
  padding:.42rem .35rem; text-align:center;
  vertical-align:middle; white-space:nowrap; font-size:1rem;
}
.td-grp { border-left:2px solid var(--border) !important; }

.td-rank { font-family:'Bebas Neue',sans-serif; font-size:1.45rem; }
.rank-1 .td-rank { color:var(--red); }
.rank-2 .td-rank { color:#6b7280; }
.rank-3 .td-rank { color:#b45309; opacity:.7; }

.td-name { text-align:left !important; padding-left:.65rem !important; width:14%; max-width:180px; overflow:hidden; }
.agent-name { font-weight:700; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
.agent-sub  { font-size:.8rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
.rank-1 .agent-name { color:var(--red); }
.rank-2 .agent-name { color:#374151; }

.td-v { }
.td-v.zero { color:var(--muted); opacity:.5; }
.td-v.today-col { font-weight:700; }
.td-v.status { font-size:.72rem; color:var(--red); font-weight:600; }

.td-total {
  font-family:'Bebas Neue',sans-serif; font-size:1.65rem;
  border-left:2px solid var(--border) !important; min-width:3.6rem;
  color:var(--red);
}
.rank-1 .td-total { color:var(--red); }

.td-lw   { font-size:.95rem; color:var(--muted); }
.td-diff { font-size:.95rem; font-weight:700; }
.td-diff.pos { color:var(--green); }
.td-diff.neg { color:var(--red); }
.td-diff.zero { color:var(--muted); }

.td-bad { font-size:.95rem; color:var(--danger); font-weight:700; }
.td-mgr { font-size:.88rem; color:var(--muted); }

/* Footer */
.lb-footer {
  display:flex; align-items:center; justify-content:space-between;
  gap:.6rem; padding:.38rem .85rem;
  background:var(--surface2); border-top:1px solid var(--border); flex-shrink:0;
}
.page-dots { display:flex; gap:.38rem; align-items:center; }
.page-dot  { width:8px;height:8px;border-radius:50%;background:#c8d6e5;transition:background .3s;cursor:pointer; }
.page-dot:hover { background:#94a3b8; }
.page-dot.active { background:var(--red); }
.page-info { font-size:.92rem; color:var(--silver); white-space:nowrap; }

.lb-controls { display:flex; align-items:center; gap:.45rem; }
.ctrl-btn {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--silver); border-radius:6px; padding:.4rem .75rem;
  font-size:.95rem; cursor:pointer; transition:all .18s; user-select:none;
}
.ctrl-btn:hover  { border-color:var(--red); color:var(--red); background:#eff6ff; }
.ctrl-btn.active { background:rgba(26,86,219,.12); border-color:var(--red); color:var(--red); }

.speed-select {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--silver); border-radius:6px; padding:.32rem .5rem;
  font-size:.82rem; cursor:pointer; font-family:inherit;
}
.speed-select:focus { outline:none; border-color:var(--blue); }

.progress-wrap { flex:1; height:3px; background:var(--border); border-radius:2px; overflow:hidden; min-width:40px; }
.progress-bar  { height:100%; background:linear-gradient(90deg,#c42e24,#e83a2f); border-radius:2px; width:0%; transition:width .9s linear; }

@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.lb-table tbody { animation:fadeUp .35s ease; }

/* Ticker */
.ticker-outer { flex-shrink:0; border-radius:6px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.07); }
.ticker-controls {
  display:flex; align-items:center; gap:.5rem;
  background:var(--surface2); border-bottom:1px solid var(--border);
  padding:.28rem .75rem;
}
.ticker-controls .tc-lbl { font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
.ticker-wrap { overflow:hidden; background:#1c1f26; padding:.32rem 0; border-top:2px solid var(--red); white-space:nowrap; }
.ticker-inner { display:inline-block; animation:ticker var(--ticker-dur,35s) linear infinite; }
.ticker-inner.ticker-paused { animation-play-state:paused; }
@keyframes ticker { from{transform:translateX(100vw)} to{transform:translateX(-100%)} }
.ticker-item { display:inline-block; margin-right:3rem; font-size:1.05rem; color:var(--silver); }
.ticker-item strong { color:#fde68a; }

/* Scrollbar */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:var(--surface2); }
::-webkit-scrollbar-thumb { background:#3e4555; border-radius:3px; }

/* Color helpers */
.cc0{color:var(--c0)} .cc1{color:var(--c1)} .cc2{color:var(--c2)}
.cc3{color:var(--c3)} .cc4{color:var(--c4)} .cc5{color:var(--c5)} .cc6{color:var(--c6)}
</style>
</head>

  <h1>Commercial<br>Sales Dashboard</h1>
  <p>Drop your Commercial_Day_Stat Excel file here to load the TV display.</p>
  <div id="drop-zone">
    <div class="icon">📊</div>
    <h2>Drop your Excel file here</h2>
    <p>or click to browse</p>
    <button class="btn" onclick="resetAndOpen()">Choose File</button>
    <input type="file" id="file-input" accept=".xlsx,.xls">
  </div>
</div>

<script>
// ── Column map for Commercial sheet ──────────────────────────────
// 0=Rep#  1=Name  2=Mon  3=Tue  4=Wed  5=Thu  6=Fri  7=Nights  8=Sat
// 9=Total COMP  10=BAD TPV  11=TOTAL WK  12=Last Week  13=Diff
// 14=Program  15=Manager  16=MWH Total

const DAYS     = ['Mon','Tue','Wed','Thu','Fri'];
const DAY_COLS = [2,3,4,5,6];  // Mon-Fri only (cols 2-6)
const COL_COMP = 9;
const COL_BAD  = 10;
const COL_WK   = 11;
const COL_LW   = 12;
const COL_DIFF = 13;
const COL_PROG = 14;
const COL_MGR  = 15;

// Cycling
let agentsPerPage = 5;
let dwellMs       = 8000;
let isPlaying     = true;
let cycleTimer    = null;
let refreshTimer  = null;
let refreshCount  = 60;
let currentPage   = 0;
let totalPages    = 1;
let agentsSorted  = [];
let lastFile      = null;
let todayIdx      = -1;

// Ticker
let tickerDur     = 35;
let tickerPlaying = true;

// ── Helpers ───────────────────────────────────────────────────────
const num  = v => (typeof v === 'number' ? v : 0);
const dCls = d => d > 0 ? 'diff-up' : d < 0 ? 'diff-down' : 'diff-zero';
const dLbl = d => (d > 0 ? '▲ +' : d < 0 ? '▼ ' : '— ') + Math.abs(d);
const fmt  = n => Number(n).toLocaleString();

function resetAndOpen() {
  const fi = document.getElementById('file-input');
  fi.value = ''; fi.click();
}

// ── Parse Commercial sheet ────────────────────────────────────────
function parseCommercial(ws) {
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
  const agents = [];

  // Find header row (has 'Rep #')
  let hdr = -1;
  for (let i = 0; i < raw.length; i++) {
    if (String(raw[i][0]).trim() === 'Rep #') { hdr = i; break; }
  }
  if (hdr < 0) return agents;

  for (let i = hdr + 1; i < raw.length; i++) {
    const r = raw[i];
    const id = r[0];
    const name = String(r[1] || '').trim();

    // Skip non-agent rows
    if (!id || isNaN(id) || !name || name === 'Total') continue;

    // Day values — may be 'OUT','TERM','NCNS','LATE' etc
    const dayVals = DAY_COLS.map(ci => {
      const v = r[ci];
      return typeof v === 'number' ? v : 0;
    });

    const dayStatus = DAY_COLS.map(ci => {
      const v = String(r[ci] || '').trim();
      return (v && isNaN(v) && v !== '0') ? v : null;
    });

    const totalWk = num(r[COL_WK]);
    const lastWk  = num(r[COL_LW]);
    const diff    = num(r[COL_DIFF]);
    const badTpv  = num(r[COL_BAD]);
    const prog    = String(r[COL_PROG] || '').trim();
    const mgr     = String(r[COL_MGR]  || '').trim();

    agents.push({ id: parseInt(id), name, dayVals, dayStatus, totalWk, lastWk, diff, badTpv, prog, mgr });
  }
  return agents;
}

// ── Build leaderboard header ───────────────────────────────────────
function buildHeader() {
  const dow = new Date().getDay();
  // Map JS day (0=Sun,1=Mon...6=Sat) to our DAYS index
  // DAYS = Mon(0) Tue(1) Wed(2) Thu(3) Fri(4)
  const dayMap = {1:0,2:1,3:2,4:3,5:4}; // Mon=1..Fri=5 in JS getDay()
  todayIdx = dayMap[dow] !== undefined ? dayMap[dow] : -1;

  const DAY_COLORS = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6'];

  // Row 1: group headers
  let r1 = `<tr>
    <th rowspan="2" style="width:4%">Rank</th>
    <th rowspan="2" style="text-align:left;padding-left:.65rem;width:14%">Agent</th>
    <th colspan="5" class="th-grp">Daily Sales  (Mon – Fri)</th>
    <th rowspan="2" class="th-grp" style="width:7%">WK<br>Total</th>
    <th rowspan="2" class="th-grp" style="width:6%">Last<br>WK</th>
    <th rowspan="2" class="th-grp" style="width:6%">+/−</th>
    <th rowspan="2" class="th-grp" style="width:5%;color:#fde68a">Bad<br>TPV</th>
    <th rowspan="2" class="th-grp" style="width:5%">Mgr</th>
  </tr>`;

  // Row 2: day sub-headers
  let r2 = `<tr>`;
  DAYS.forEach((day, di) => {
    const borderL  = di === 0 ? 'th-grp' : '';
    const hiStyle  = di === todayIdx ? 'color:var(--red);font-weight:700' : '';
    r2 += `<th class="${borderL}" style="${hiStyle};width:10.6%">${day}</th>`;
  });
  r2 += `</tr>`;

  document.getElementById('lb-head').innerHTML = r1 + r2;
}

// ── Render one page ───────────────────────────────────────────────
function renderPage(page) {
  currentPage = page;
  const start = page * agentsPerPage;
  const slice = agentsSorted.slice(start, start + agentsPerPage);

  const rows = slice.map((a, ri) => {
    const rank      = start + ri + 1;
    const rankClass = rank <= 3 ? `rank-${rank}` : '';
    const medal     = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

    // Day cells
    let dayCells = '';
    a.dayVals.forEach((v, di) => {
      const borderL  = di === 0 ? 'td-grp' : '';
      const todayCls = di === todayIdx ? 'today-col' : '';
      const todayStyle = di === todayIdx ? 'color:var(--red);font-weight:700;' : '';

      if (a.dayStatus[di]) {
        dayCells += `<td class="td-v ${borderL} status" style="${todayStyle}">${a.dayStatus[di]}</td>`;
      } else {
        const zeroCls = v === 0 ? 'zero' : '';
        dayCells += `<td class="td-v ${borderL} ${todayCls} ${zeroCls}" style="${todayStyle}">${v > 0 ? v : '—'}</td>`;
      }
    });

    // Diff styling
    const diffCls = a.diff > 0 ? 'pos' : a.diff < 0 ? 'neg' : 'zero';
    const diffTxt = a.diff > 0 ? `▲ +${a.diff}` : a.diff < 0 ? `▼ ${a.diff}` : '—';

    // Clean agent name (remove dept suffix in parens)
    const cleanName = a.name.replace(/\s*\([^)]*\)\s*/g,'').trim();

    return `<tr class="${rankClass}">
      <td class="td-rank">${medal}</td>
      <td class="td-name">
        <div class="agent-name">${cleanName}</div>
        <div class="agent-sub">#${a.id}${a.prog ? ' · ' + a.prog : ''}${a.mgr ? ' · ' + a.mgr : ''}</div>
      </td>
      ${dayCells}
      <td class="td-total">${a.totalWk}</td>
      <td class="td-lw td-grp">${a.lastWk}</td>
      <td class="td-diff ${diffCls} td-grp">${diffTxt}</td>
      <td class="td-bad td-grp">${a.badTpv > 0 ? a.badTpv : '—'}</td>
      <td class="td-mgr td-grp">${a.mgr}</td>
    </tr>`;
  }).join('');

  document.getElementById('lb-body').innerHTML = rows;

  // Page dots
  document.getElementById('page-dots').innerHTML =
    Array.from({length:totalPages}, (_,i) =>
      `<div class="page-dot ${i===page?'active':''}" onclick="goToPage(${i})"></div>`
    ).join('');

  document.getElementById('page-info').textContent =
    `Showing ${start+1}–${Math.min(start+slice.length, agentsSorted.length)} of ${agentsSorted.length} agents  •  Page ${page+1} of ${totalPages}`;
}

// ── Cycling controls ──────────────────────────────────────────────
function goToPage(page) {
  renderPage(page);
  if (isPlaying) { clearInterval(cycleTimer); resetProgress(); startCycling(); }
}

function startCycling() {
  clearInterval(cycleTimer);
  cancelAnimationFrame(window._pRAF);
  resetProgress();
  if (!isPlaying || totalPages <= 1) return;
  animateProgress();
  cycleTimer = setInterval(() => {
    renderPage((currentPage + 1) % totalPages);
    resetProgress(); animateProgress();
  }, dwellMs);
}

function resetProgress() {
  cancelAnimationFrame(window._pRAF);
  const bar = document.getElementById('progress-bar');
  if (bar) { bar.style.transition='none'; bar.style.width='0%'; }
}

function animateProgress() {
  if (!isPlaying || totalPages <= 1) return;
  const bar = document.getElementById('progress-bar');
  if (!bar) return;
  bar.getBoundingClientRect();
  bar.style.transition = `width ${dwellMs}ms linear`;
  bar.style.width = '100%';
}

function setPlaying(play) {
  isPlaying = play;
  const btn = document.getElementById('btn-playpause');
  if (btn) { btn.innerHTML = play ? '&#9646;&#9646; Pause' : '&#9654; Play'; btn.classList.toggle('active', play); }
  if (play) startCycling();
  else { clearInterval(cycleTimer); resetProgress(); }
}

function wireControls() {
  document.getElementById('btn-prev').onclick = () => {
    renderPage((currentPage - 1 + totalPages) % totalPages);
    if (isPlaying) { clearInterval(cycleTimer); resetProgress(); startCycling(); }
  };
  document.getElementById('btn-next').onclick = () => {
    renderPage((currentPage + 1) % totalPages);
    if (isPlaying) { clearInterval(cycleTimer); resetProgress(); startCycling(); }
  };
  document.getElementById('btn-playpause').onclick  = () => setPlaying(!isPlaying);
  document.getElementById('speed-select').onchange  = e => { dwellMs = parseInt(e.target.value); if (isPlaying) startCycling(); };
  document.getElementById('rows-select').onchange   = e => {
    agentsPerPage = parseInt(e.target.value);
    totalPages = Math.max(1, Math.ceil(agentsSorted.length / agentsPerPage));
    currentPage = 0; renderPage(0); if (isPlaying) startCycling();
  };
}

// ── Ticker controls ───────────────────────────────────────────────
function applyTickerSpeed() {
  const inner = document.getElementById('ticker');
  const lbl   = document.getElementById('ticker-speed-label');
  if (!inner) return;
  const clone = inner.cloneNode(true);
  if (!tickerPlaying) clone.classList.add('ticker-paused');
  inner.parentNode.replaceChild(clone, inner);
  document.documentElement.style.setProperty('--ticker-dur', tickerDur + 's');
  if (lbl) lbl.textContent = tickerDur + 's';
}

function wireTickerControls() {
  document.getElementById('ticker-slower').onclick = () => { tickerDur = Math.min(tickerDur+10,120); applyTickerSpeed(); };
  document.getElementById('ticker-faster').onclick = () => { tickerDur = Math.max(tickerDur-10,5);  applyTickerSpeed(); };
  document.getElementById('ticker-playpause').onclick = () => {
    tickerPlaying = !tickerPlaying;
    const btn = document.getElementById('ticker-playpause');
    btn.innerHTML = tickerPlaying ? '&#9646;&#9646; Pause' : '&#9654; Play';
    btn.classList.toggle('active', tickerPlaying);
    const inner = document.getElementById('ticker');
    if (inner) inner.classList.toggle('ticker-paused', !tickerPlaying);
  };
}

// ── Refresh countdown ─────────────────────────────────────────────
function startRefreshCountdown() {
  clearInterval(refreshTimer);
  refreshCount = 60;
  updateCountdown();
  refreshTimer = setInterval(() => {
    refreshCount--;
    updateCountdown();
    if (refreshCount <= 0) { refreshCount = 60; if (lastFile) reloadFile(); }
  }, 1000);
}

function updateCountdown() {
  const el = document.getElementById('refresh-countdown');
  if (el) el.textContent = `Auto-refresh in ${refreshCount}s`;
}

function reloadFile() {
  if (!lastFile) return;
  const reader = new FileReader();
  reader.onload = e => buildDashboard(XLSX.read(new Uint8Array(e.target.result), {type:'array'}));
  reader.readAsArrayBuffer(lastFile);
}

// ── Main build ────────────────────────────────────────────────────
function buildDashboard(wb) {
  // Try Commercial sheet first
  const sheetName = wb.SheetNames.find(s => s.toLowerCase().includes('commercial')) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];

  if (!ws) { alert('Could not find Commercial sheet in this file.'); return; }

  document.getElementById('file-label').textContent = `Sheet: ${sheetName}`;

  const agents = parseCommercial(ws);

  // Sort by total WK descending, active only
  agentsSorted = agents.filter(a => a.totalWk > 0 || a.lastWk > 0)
                       .sort((a,b) => b.totalWk - a.totalWk);

  if (agentsSorted.length === 0) {
    // Show all if no one has sales yet
    agentsSorted = agents.sort((a,b) => b.totalWk - a.totalWk);
  }

  // Grand banner
  const grandTotal = agentsSorted.reduce((s,a) => s+a.totalWk, 0);
  const grandLW    = agentsSorted.reduce((s,a) => s+a.lastWk,  0);
  const wd         = grandTotal - grandLW;
  document.getElementById('grand-total').textContent     = grandTotal;
  document.getElementById('last-week-total').textContent = grandLW;
  const wdEl = document.getElementById('week-diff');
  wdEl.textContent = dLbl(wd) + ' vs last week';
  wdEl.className   = dCls(wd);

  // Daily stat cards
  const dayTotals = DAYS.map((_, di) => agentsSorted.reduce((s,a) => s + a.dayVals[di], 0));
  const DAY_CLS   = ['cc0','cc1','cc2','cc3','cc4','cc5','cc6'];
  document.getElementById('stat-row').innerHTML = DAYS.map((day, di) => `
    <div class="stat-card">
      <div class="sc-lbl">${day}</div>
      <div class="sc-val ${DAY_CLS[di]}">${dayTotals[di]}</div>
      <div class="sc-sub">sales</div>
    </div>`).join('');

  // Build header & leaderboard
  totalPages  = Math.max(1, Math.ceil(agentsSorted.length / agentsPerPage));
  currentPage = 0;
  buildHeader();
  renderPage(0);
  isPlaying = true;
  startCycling();
  wireControls();
  wireTickerControls();

  // Ticker
  const ti = agentsSorted.map(a =>
    `<span class="ticker-item"><strong>${a.name.replace(/\s*\([^)]*\)/g,'').trim()}</strong> — ${a.totalWk} sales this week${a.badTpv > 0 ? ' · ⚠ ' + a.badTpv + ' Bad TPV' : ''}</span>`
  ).join('');
  document.getElementById('ticker').innerHTML = ti + ti;

  // Show dashboard
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';

  startRefreshCountdown();
}

// ── File loading ──────────────────────────────────────────────────
function loadFile(file) {
  lastFile = file;
  document.getElementById('file-label').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => buildDashboard(XLSX.read(new Uint8Array(e.target.result), {type:'array'}));
  reader.readAsArrayBuffer(file);
}

const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', e => { if (e.target.files[0]) { loadFile(e.target.files[0]); fileInput.value=''; } });

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
dz.addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') resetAndOpen(); });
</script>
